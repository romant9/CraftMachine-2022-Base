apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // 1. Отключаем десугаризацию, вызывающую StackOverflow
        coreLibraryDesugaringEnabled false
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    // 2. Интегрируем правила упаковки прямо в структуру вместо макроса Unity
    packagingOptions {
        doNotStrip "**/eos-sdk-runtime.jar"
        merge "**/eos-sdk-runtime.jar"
    }
}

// Сюда Unity вставит настройки IL2CPP
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**

// 3. СТРОГО В САМОМ КОНЦЕ ФАЙЛА (После всех инъекций кода от Unity):
project.afterEvaluate {
    tasks.configureEach { task ->
        if (task.class.name.contains("DexArchiveBuilderTask")) {
            task.exclude "**/eos-sdk-runtime.jar"
            task.exclude "**/jetified-eos-sdk-runtime.jar"
        }
    }
}
